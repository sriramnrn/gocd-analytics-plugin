plugins {
  id "java"
  id "com.github.node-gradle.node" version "7.0.0"
}

apply from: "https://raw.githubusercontent.com/gocd/gocd-plugin-gradle-task-helpers/master/helper.gradle?_=${(int) (new Date().toInstant().epochSecond / 60)}"

group = 'com.thoughtworks.gocd'

gocdPlugin {
  id = 'com.thoughtworks.gocd.analytics'
  pluginVersion = '3.1.1'
  goCdVersion = '20.9.0'
  name = 'GoCD Analytics Plugin'
  description = 'GoCD Analytics Plugin'
  vendorName = 'ThoughtWorks, Inc.'
  vendorUrl = 'https://github.com/gocd/gocd-analytics-plugin'

  githubRepo {
    owner = System.getenv('GITHUB_USER') ?: 'bob'
    repo = 'gocd-analytics-plugin'
    token = System.getenv('GITHUB_TOKEN') ?: 'bad-token'
  }

  pluginProject = project

  prerelease = !"No".equalsIgnoreCase(System.getenv('PRERELEASE'))
  assetsToRelease = [project.tasks.findByName('jar')]
}

version = gocdPlugin.fullVersion(project)

def frontendDebugTaskRequested = gradle.startParameter.taskNames.any { taskName ->
  taskName == 'debugPluginJar' ||
    taskName.endsWith(':debugPluginJar') ||
    taskName == 'syncDebugPluginAssets' ||
    taskName.endsWith(':syncDebugPluginAssets')
}
def frontendDebugBuild = providers.gradleProperty('frontendDebug').map { it.toBoolean() }.orElse(frontendDebugTaskRequested)
def goCdRepoPath = providers.gradleProperty('gocdRepo').orElse(providers.environmentVariable('GOCD_REPO'))
def pluginAssetsHash = providers.gradleProperty('pluginAssetsHash').orElse(providers.environmentVariable('GOCD_PLUGIN_ASSETS_HASH'))
def skipNpm = providers.gradleProperty('skipNpm').map { it.toBoolean() }.orElse(false)

def resolveGoCdPluginAssetCacheDir = {
  if (!goCdRepoPath.isPresent()) {
    throw new GradleException("Set -PgocdRepo=/path/to/gocd or GOCD_REPO=/path/to/gocd. Alternatively use npm run webpack-debug-watch-sync with GOCD_PLUGIN_ASSET_CACHE_DIR set to the exact hash directory.")
  }

  def pluginAssetRoot = file("${goCdRepoPath.get()}/server/src/main/webapp/WEB-INF/rails/public/assets/plugins/${gocdPlugin.id}")
  if (!pluginAssetRoot.directory) {
    throw new GradleException("GoCD plugin asset root does not exist: ${pluginAssetRoot}. Start GoCD with the jar installed so plugin metadata load extracts assets first.")
  }

  if (pluginAssetsHash.isPresent()) {
    def hashDir = new File(pluginAssetRoot, pluginAssetsHash.get())
    if (!hashDir.directory) {
      throw new GradleException("GoCD plugin asset hash directory does not exist: ${hashDir}")
    }
    return hashDir
  }

  def hashDirs = pluginAssetRoot.listFiles({ File file -> file.directory } as FileFilter)
  if (!hashDirs) {
    throw new GradleException("No hash directories found under ${pluginAssetRoot}. Trigger GoCD plugin metadata load/reload first.")
  }

  return hashDirs.max { it.lastModified() }
}

java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
}

// In this section you declare where to find the dependencies of your project
repositories {
  mavenCentral()
  mavenLocal()
}

sourceSets {
  integrationTest {
    java.srcDirs = ['src/integration/java']
    resources.srcDirs += ['src/testdata']
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
  }
}

configurations {
  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom runtimeOnly
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
  compileOnly 'cd.go.plugin:go-plugin-api:23.3.0'
  implementation 'com.google.code.gson:gson:2.10.1'
  implementation('org.postgresql:postgresql:42.6.0') {
    exclude(module: 'checker-qual')
  }
  implementation 'org.apache.commons:commons-dbcp2:2.9.0'
  implementation 'org.mybatis:mybatis:3.4.6'
  implementation 'org.flywaydb:flyway-core:4.2.0'
  implementation 'org.slf4j:slf4j-api:2.0.7'
  runtimeOnly 'ch.qos.logback:logback-classic:1.4.11'

  testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
  testImplementation 'org.mockito:mockito-core:5.5.0'
  testImplementation 'org.skyscreamer:jsonassert:1.5.1'
  testImplementation 'org.jsoup:jsoup:1.16.1'
  testImplementation 'org.skyscreamer:jsonassert:1.5.1'
  testImplementation 'cd.go.plugin:go-plugin-api:23.3.0'

  integrationTestImplementation 'org.slf4j:slf4j-simple:2.0.7'
}

clean.doFirst {
    delete "${rootDir}/src/main/resources-generated"
    delete "${rootDir}/build"
}

task generateWebpackAssets(type: NpmTask) {
  inputs.files(fileTree('node_modules'))
  inputs.files(fileTree('assets'))
  inputs.file('package.json')
  inputs.file('package-lock.json')
  inputs.file('config/webpack.config.js')
  inputs.file('config/webpack.debug.js')
  inputs.file('config/webpack.prod.js')

  outputs.dir('build/resources/webpack')

  dependsOn npm_install
  args = ['run', frontendDebugBuild.get() ? 'webpack-debug' : (System.getenv('FOR_ENVIRONMENT') == 'development' ? 'webpack-dev' : 'webpack-prod')]
}

task watchWebpackDebugAssets(type: NpmTask) {
  inputs.files(fileTree('node_modules'))
  inputs.files(fileTree('assets'))
  inputs.file('package.json')
  inputs.file('package-lock.json')
  inputs.file('config/webpack.config.js')
  inputs.file('config/webpack.debug.js')

  outputs.dir('build/resources/webpack')

  dependsOn npm_install
  args = ['run', 'webpack-debug-watch']
}

task syncDebugPluginAssets(type: Sync) {
  group = 'development'
  description = 'Builds debug frontend assets and syncs them into GoCD server asset cache. Set -PgocdRepo=/path/to/gocd and optionally -PpluginAssetsHash=<hash>.'

  dependsOn generateWebpackAssets
  from "${project.buildDir}/resources/webpack"
  into { resolveGoCdPluginAssetCacheDir() }
}

task watchAndSyncDebugPluginAssets(type: NpmTask) {
  group = 'development'
  description = 'Watches debug frontend assets and syncs each rebuild into GoCD server asset cache. Set -PgocdRepo=/path/to/gocd and optionally -PpluginAssetsHash=<hash>.'

  inputs.files(fileTree('node_modules'))
  inputs.files(fileTree('assets'))
  inputs.file('package.json')
  inputs.file('package-lock.json')
  inputs.file('config/webpack.config.js')
  inputs.file('config/webpack.debug.js')
  inputs.file('scripts/webpack-debug-watch-sync.js')

  outputs.dir('build/resources/webpack')

  dependsOn npm_install
  def npmArgs = ['run', 'webpack-debug-watch-sync']
  if (goCdRepoPath.isPresent()) {
    npmArgs.addAll(['--', '--gocd-repo', goCdRepoPath.get()])
  }
  if (pluginAssetsHash.isPresent()) {
    if (!goCdRepoPath.isPresent()) {
      npmArgs.add('--')
    }
    npmArgs.addAll(['--plugin-assets-hash', pluginAssetsHash.get()])
  }
  args = npmArgs
}

def props = [
  'db.host'    : System.getenv('DB_HOST') ? System.getenv('DB_HOST') : '192.168.1.6',
  'db.user'    : System.getenv('DB_USER') ? System.getenv('DB_USER') : 'postgres',
  'db.password': System.getenv('DB_PASSWORD') ? System.getenv('DB_PASSWORD') : 'mysecretpassword',
  'db.port'    : System.getenv('DB_PORT') ? System.getenv('DB_PORT') : '5432',
  'db.name'    : System.getenv('DB_NAME') ? System.getenv('DB_NAME') : 'gocd_test'
]
project.ext.testSystemProperties = props

task dropDB(type: Exec) {
  outputs.upToDateWhen { false }

  commandLine = ['dropdb', '--if-exists', '--host', project.testSystemProperties['db.host'], '--port', project.testSystemProperties['db.port'], '--username', project.testSystemProperties['db.user'], project.testSystemProperties['db.name']]
  standardOutput = System.out
  errorOutput = System.err

  doFirst {
    logger.lifecycle("Attempting to drop DB '${project.testSystemProperties['db.name']}' on '${project.testSystemProperties['db.host']}'")
  }
}

task createDB(type: Exec) {
  dependsOn dropDB
  outputs.upToDateWhen { false }
  commandLine = ['createdb', '--host', project.testSystemProperties['db.host'], '--port', project.testSystemProperties['db.port'], '--username', project.testSystemProperties['db.user'], project.testSystemProperties['db.name']]

  standardOutput = System.out
  errorOutput = System.err

  doFirst {
    logger.lifecycle("Attempting to create DB '${project.testSystemProperties['db.name']}' on '${project.testSystemProperties['db.host']}'")
  }
}

task prepareDb() {
  dependsOn createDB
}

task integrationTest(type: Test, description: 'Runs the DB integration tests.') {
  systemProperties(props)
  useJUnitPlatform()
  dependsOn prepareDb
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath

  shouldRunAfter test
}

task packageAssetSourceMaps(type: Zip) {
  dependsOn generateWebpackAssets

  from "${project.buildDir}/resources/webpack"
  destinationDirectory = file("${project.buildDir}/libs")
  archiveFileName = "${project.name}-${project.version}-source-maps.zip"
  include '**/*.map'

  preserveFileTimestamps = false
  reproducibleFileOrder = true
}

task packageAssets(type: Zip) {
  dependsOn packageAssetSourceMaps

  from "${project.buildDir}/resources/webpack"
  destinationDirectory = file("${project.buildDir}/resources")
  archiveFileName = 'assets.zip'
  if (!frontendDebugBuild.get()) {
    exclude '**/*.map'
  }

  preserveFileTimestamps = false
  reproducibleFileOrder = true
}

processResources {
  from("src/main/resource-templates") {
    filesMatching('plugin.xml') {
      expand project.pluginDesc
    }

    filesMatching('plugin.properties') {
      expand project.pluginDesc
    }
  }

  from packageAssets

  dependsOn "generateResources" // defined in gocd-plugin-gradle-task-helpers
}

task debugPluginJar {
  group = 'build'
  description = 'Builds the plugin jar with unminified frontend JavaScript and external source maps packaged in assets.zip.'
  dependsOn jar
}

task lint(type: NpmTask) {
  inputs.files(fileTree('node_modules'))
  inputs.files(fileTree('assets/js'))
  inputs.file('package.json')
  inputs.file('package-lock.json')

  dependsOn npm_install
  args = ['run', 'lint']
}

task assetSpecs(type: NpmTask) {
  inputs.files(fileTree('node_modules'))
  inputs.files(fileTree('spec'))
  inputs.file('package.json')
  inputs.file('package-lock.json')
  inputs.file('config/webpack.config.js')
  inputs.file('config/karma.config.js')

  dependsOn npm_install
  args = ['run', 'specs-ci']
}

tasks.withType(NpmTask).configureEach {
  onlyIf {
    if (skipNpm.get()) {
      logger.lifecycle("Skipping ${path} because -PskipNpm=true was specified.")
      return false
    }
    true
  }
}

[packageAssetSourceMaps, packageAssets, syncDebugPluginAssets].each { npmRelatedTask ->
  npmRelatedTask.onlyIf {
    if (skipNpm.get()) {
      logger.lifecycle("Skipping ${npmRelatedTask.path} because -PskipNpm=true was specified.")
      return false
    }
    true
  }
}

test.dependsOn lint
//test.dependsOn assetSpecs
//check.dependsOn integrationTest

test {
  // useJUnitPlatform()
}

jar {
  from(configurations.runtimeClasspath) {
    into "lib/"
  }
}
